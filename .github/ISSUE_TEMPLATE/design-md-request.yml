name: 主题规范反馈
description: 记录主题规范或交互预览的问题
title: "主题反馈："
labels: ["design-md"]

body:
  - type: markdown
    attributes:
      value: |
        请描述现有主题中的具体问题，不需要提交网站生成请求或联系方式。
  - type: dropdown
    id: theme
    attributes:
      label: 主题
      options:
        - neuro
        - neuro-mini
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: 具体位置
      description: 文档章节、控件或页面
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: 问题与期望
      description: 说明当前表现、期望规则，以及必要的复现步骤或截图
    validations:
      required: true
